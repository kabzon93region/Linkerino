name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32)
        run: cmake -S . -B build/win32 -A Win32

      - name: Build
        run: cmake --build build/win32 --config Release

      - name: Tests
        run: ctest --test-dir build/win32 -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkerino-win32
          path: build/win32/Release/Linkerino.exe
          if-no-files-found: error

  rust:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Tests
        working-directory: rust
        run: cargo test --release -- --test-threads=1

      - name: Smoke (CLI transfer)
        run: powershell -ExecutionPolicy Bypass -File scripts\smoke-rust.ps1 -SkipGui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkerino-rust
          path: rust/target/release/Linkerino.exe
          if-no-files-found: error
